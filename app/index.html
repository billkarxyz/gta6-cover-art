<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <header>
      <h1>VICE COVER<br>STUDIO</h1>
      <p>Turn a photo into GTA-style cover art. Your photos never leave this machine.</p>
    </header>

    <section class="group">
      <h2>1 · Photos</h2>
      <label class="file">Photo A
        <input id="photo-a" type="file" accept="image/*">
        <span class="file-name" id="photo-a-name">No photo yet</span>
      </label>
      <label class="file">Photo B
        <input id="photo-b" type="file" accept="image/*">
        <span class="file-name" id="photo-b-name">No photo yet</span>
      </label>
      <label class="file">Photo C
        <input id="photo-c" type="file" accept="image/*">
        <span class="file-name" id="photo-c-name">No photo yet</span>
      </label>
      <button id="samples" type="button" class="secondary">Load sample photos</button>
    </section>

    <section class="group">
      <h2>2 · Layout</h2>
      <div class="pick" id="layout-pick"></div>
    </section>

    <section class="group">
      <h2>3 · Colour grade — <span id="grade-name"></span></h2>
      <div class="pick swatches" id="grade-pick"></div>
    </section>

    <section class="group">
      <h2>4 · Caption</h2>
      <label>Caption
        <input id="caption" type="text" maxlength="30" value="Sunset Heist">
      </label>
      <label>Tagline
        <input id="tagline" type="text" maxlength="30" value="Neon After Dark">
      </label>
    </section>

    <section class="group">
      <h2>5 · Panel — <span id="panel-label"></span></h2>
      <p class="hint">Click a panel in the preview to select it.</p>
      <label>Photo in this panel
        <select id="panel-photo">
          <option value="0">Photo A</option>
          <option value="1">Photo B</option>
          <option value="2">Photo C</option>
        </select>
      </label>
      <label>Zoom — <span id="zoom-value">100%</span>
        <input id="panel-zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <label>Position left–right
        <input id="panel-x" type="range" min="0" max="1" step="0.01" value="0.5">
      </label>
      <label>Position top–bottom
        <input id="panel-y" type="range" min="0" max="1" step="0.01" value="0.5">
      </label>
    </section>

    <section class="group">
      <h2>6 · Export</h2>
      <div class="pick" id="size-pick"></div>
      <button id="export" type="button" class="primary">Export PNG</button>
      <p id="status" role="status"></p>
    </section>
  </section>

  <section class="stage" aria-label="Live preview">
    <canvas id="preview" width="720" height="405" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/editor.js"></script>
</body>
</html>
